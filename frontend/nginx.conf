# frontend/nginx.conf — serve the SPA and proxy the API to the backend container
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (docker-compose service name).
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve uploaded images through the backend too.
    location /uploads/ {
        proxy_pass http://backend:3001;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
